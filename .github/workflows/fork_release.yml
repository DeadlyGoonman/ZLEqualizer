name: Fork Release

# Push a tag `fork-<N>` (N must equal the number in FORK_BUILD) to publish a Windows VST3 release.
# The in-plugin updater looks for the asset `ZLEqualizer-fork-<N>-windows-vst3.zip`.
on:
  push:
    tags:
      - "fork-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (fork-<N>)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Check tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^fork-[0-9]+$ ]]; then
            echo "Tag must look like fork-<N>, got: $RELEASE_TAG"
            exit 1
          fi
          echo "FORK_N=${RELEASE_TAG#fork-}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Check FORK_BUILD matches the tag
        shell: bash
        run: |
          build="$(tr -d '[:space:]' < FORK_BUILD)"
          if [[ "$build" != "$FORK_N" ]]; then
            echo "FORK_BUILD is $build but the tag is $RELEASE_TAG; bump FORK_BUILD before tagging."
            exit 1
          fi

      # compile cache: only changed files are recompiled, the rest comes from the previous run
      - name: Install ccache
        shell: pwsh
        run: |
          choco install ccache -y --no-progress
          "CCACHE_DIR=$env:GITHUB_WORKSPACE\.ccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CCACHE_MAXSIZE=1G" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore compile cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-win-${{ github.sha }}
          restore-keys: |
            ccache-win-

      - name: Configure and Build
        uses: ./.github/actions/build
        with:
          formats: VST3
          simd: AVX2
          vcvars-script: vcvars64.bat
          cmake-extra-args: |
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: ccache stats
        if: always()
        shell: pwsh
        run: ccache -s

      - name: Check VST3 dependencies and compatibility
        shell: bash
        run: |
          python3 -u packaging/check_dependency.py

      - name: Zip VST3 bundle
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, pathlib, zipfile
          bundle = pathlib.Path(os.environ["VST3_PATH"])
          out = pathlib.Path(f"ZLEqualizer-fork-{os.environ['FORK_N']}-windows-vst3.zip")
          # forward-slash entry names with the bundle folder at the zip root
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for path in sorted(bundle.rglob("*")):
                  if path.is_file():
                      z.write(path, (pathlib.PurePosixPath(bundle.name) / path.relative_to(bundle).as_posix()).as_posix())
          print("wrote", out, out.stat().st_size, "bytes")
          EOF

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $bundle = (Resolve-Path $env:VST3_PATH).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBundleDir=$bundle" "/DAppVersion=fork-$env:FORK_N" "/DOutName=ZLEqualizer-fork-$env:FORK_N-windows-installer" "/O$PWD" packaging\fork_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ZLEqualizer-fork-$env:FORK_N-windows-installer.exe" | Select-Object Name, Length

      - name: Create GitHub release
        shell: bash
        run: |
          # patch notes live in release_notes/fork-<N>.md; fall back to a one-liner
          NOTES_FILE="release_notes/fork-${FORK_N}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            NOTES_FILE="$RUNNER_TEMP/notes.md"
            echo "Fork build ${FORK_N} (Windows VST3). Run the installer exe, or unzip the VST3. Installed plugins offer this update automatically." > "$NOTES_FILE"
          fi
          gh release create "$RELEASE_TAG" "ZLEqualizer-fork-${FORK_N}-windows-vst3.zip" "ZLEqualizer-fork-${FORK_N}-windows-installer.exe" \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
